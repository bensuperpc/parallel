services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    profiles:
      - rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - ./env/variables.rabbitmq.env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
volumes:
  rabbitmq-data:
