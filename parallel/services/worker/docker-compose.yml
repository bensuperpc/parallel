services:
  worker-high:
    build:
      context: ..
      dockerfile: worker/Dockerfile.worker
      network: host
    env_file:
      - ./env/variables.worker.env
    environment:
      - CELERY_QUEUES=video.high,video.all
    profiles:
      - worker-high
    depends_on:
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks:celery_app inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
  worker-low:
    build:
      context: ..
      dockerfile: worker/Dockerfile.worker
      network: host
    profiles:
      - worker-low
    env_file:
      - ./env/variables.worker.env
    environment:
      - CELERY_QUEUES=video.low,video.all
    depends_on:
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks:celery_app inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
