services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile.api
      network: host
    container_name: api
    profiles:
      - api
    ports:
      - "5500:5500"
    env_file:
      - ./env/variables.api.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5500/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
