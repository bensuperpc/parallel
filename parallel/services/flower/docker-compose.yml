services:
  flower:
    image: mher/flower
    container_name: flower
    env_file:
      - ./env/variables.flower.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec celery flower --broker="amqp://$$RABBITMQ_USER:$$RABBITMQ_PASS@$$RABBITMQ_HOST" --port=5555 --basic_auth="$$FLOWER_BASIC_AUTH_USER:$$FLOWER_BASIC_AUTH_PASS"
    profiles:
      - flower
    ports:
      - "5555:5555"
    depends_on:
      - rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 5555), timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
